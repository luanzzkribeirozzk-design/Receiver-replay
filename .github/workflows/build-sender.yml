name: Build APK - Sender

on:
  push:
    branches: [main, master]
    paths:
      - 'sender/**'
      - '.github/workflows/build-sender.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sender

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Instalar Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Gerar Gradle Wrapper
        run: gradle wrapper --gradle-version=8.4

      - name: Build APK debug assinado automaticamente
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar APK debug
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK debug do Sender gerado com sucesso."

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: ReplayX-Sender-APK-debug
          path: sender/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
