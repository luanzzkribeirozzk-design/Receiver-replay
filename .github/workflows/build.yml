name: Build APK - Receiver

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Instalar Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Gerar Gradle Wrapper
        run: gradle wrapper --gradle-version=8.4

      - name: Build APK release sem assinatura
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verificar APK release sem assinatura
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          echo "APK sem assinatura gerado com sucesso."

      - name: Upload APK sem assinatura
        uses: actions/upload-artifact@v4
        with:
          name: ReplayX-Receiver-APK-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
